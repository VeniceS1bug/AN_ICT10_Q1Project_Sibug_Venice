<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolce Venice - SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
            background-color: #172775;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #172775;
            padding: 20px 0;
            border-bottom: 2px solid #fffdd0;
        }

        .navbar {
            text-align: center;
        }

        .navbar h2 {
            color: #FFDA7B;
            font-size: 50px;
            margin: 5px 0 15px 0;
            font-family: cursive;
        }

        .nav-links {
            text-align: center;
            margin-top: 5px;
        }

        .nav-links a {
            display: inline-block;
            color: #172775;
            background-color: #fffdd0;
            text-decoration: none;
            margin: 0 8px;
            padding: 8px 16px;
            font-size: 16px;
            border: 1px solid #fffdd0;
            border-radius: 20px;
        }

        .nav-links a:hover {
            background-color: #172775;
            color: #fffdd0;
        }

        .nav-links a.active {
            background-color: #FFDA7B;
            color: #172775;
            font-weight: bold;
        }

        .welcome {
            text-align: center;
            color: white;
            margin: 40px 20px;
        }

        .welcome h1 {
            color: #fffdd0;
            font-size: 40px;
            font-family: cursive;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 17px;
        }

        .sku-container {
            background-color: #fffdd0;
            width: 500px;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .sku-container h2 {
            color: #172775;
        }

        .sku-container select,
        .sku-container input {
            padding: 8px;
            width: 250px;
            font-family: inherit;
        }

        .sku-container button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #172775;
            color: #fffdd0;
            border: none;
            border-radius: 5px;
            font-family: inherit;
            font-size: 16px;
        }

        .sku-container button:hover {
            background-color: #24378c;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid black;
        }

        #result h2 {
            color: #172775;
            font-family: cursive;
        }

        #sku {
            color: #172775;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <header>
        <div class="navbar">
            <h2>Dolce Venice</h2>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="sku.html" class="active">SKU Generator</a>
                <a href="receipt.html">Receipt Generator</a>
            </div>
        </div>
    </header>

    <div class="welcome">
        <h1>SKU Generator</h1>
        <p>Create a unique SKU for your Dolce Venice chocolates.</p>
    </div>

    <div class="sku-container">
        <h2>Product Information</h2>

        <label for="category">Product Category:</label>
        <br><br>

        <select id="category">
            <option value="CHO">Classic Chocolate (Fondente, Latte, Bianco)</option>
            <option value="SPE">Specialty Flavor (Caramello Salato, Pistacchio)</option>
        </select>

        <br><br>

        <label for="product">Product Name:</label>
        <br><br>

        <input type="text" id="product" placeholder="Example: Fondente">

        <br><br>

        <label for="stock">Stock Quantity:</label>
        <br><br>

        <input type="number" id="stock" min="1" placeholder="Example: 25">

        <br><br>

        <button py-click="generate_sku">Generate SKU</button>

        <div id="result">
            <h2>Your SKU</h2>
            <h3 id="sku">---</h3>
        </div>

    </div>

    <script type="py" src="sku.py"></script>

</body>
</html>
